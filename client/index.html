<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- DNS prefetch and preconnect for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload critical fonts inline for faster FCP -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    
    <!-- Critical CSS for initial render (above the fold) -->
    <style>
      /* Critical CSS - prevents layout shift and speeds up FCP */
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;padding:0;overflow-x:hidden}
      body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#fff;color:#141414}
      #root{min-height:100vh}
      /* Hero section placeholder to prevent CLS */
      .hero-placeholder{min-height:100vh;background:linear-gradient(135deg,hsl(214 84% 35%/0.7),hsl(214 84% 35%/0.6))}
    </style>
    
    <!-- Default meta tags for crawlers (overridden by React Helmet on each page) -->
    <title>HomeBuyerBoise | Sell Your Boise House Fast for Cash</title>
    <meta name="description" content="Sell your house fast for cash in Boise & Treasure Valley. No fees, no commissions, close on your timeline. Fair cash offers in 24 hours." />
    
    <!-- Open Graph / Featured Image -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="HomeBuyerBoise heart logo - Cash home buyers in Boise Idaho" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="HomeBuyerBoise heart logo - Cash home buyers in Boise Idaho" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
