<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- DNS prefetch and preconnect for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload Inter font with display=swap for non-render-blocking loading -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    
    <!-- Default meta tags for crawlers (overridden by React Helmet on each page) -->
    <title>HomeBuyerBoise | Cash Home Buyers in Boise, Idaho</title>
    <meta name="description" content="Sell your house fast for cash in Boise, Meridian, Nampa, Caldwell, Eagle, Kuna, Star, and Garden City. No fees, no commissions, close on your timeline. Fair cash offers in 24 hours." />
    
    <!-- Open Graph / Featured Image -->
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:image:alt" content="HomeBuyerBoise - Professional cash home buyers serving the Boise Treasure Valley" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/favicon.png" />
    <meta name="twitter:image:alt" content="HomeBuyerBoise - Professional cash home buyers serving the Boise Treasure Valley" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
